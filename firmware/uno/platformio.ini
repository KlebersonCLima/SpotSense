; SpotSense — firmware do Arduino UNO (sensor HC-SR04 + ponte serial no notebook)
; Documentação: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_extra_dirs = ../comum

; Diagnóstico: mesma placa, mas imprime distância e fundo a cada leitura.
; Uso: python -m platformio run -e uno_diagnostico -t upload
[env:uno_diagnostico]
extends = env:uno
build_flags = -DDIAGNOSTICO
